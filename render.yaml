services:
  - type: web
    name: dr-screening-api
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DR_MODEL_ID
        value: Aldahmashi/DR-EfficientNetB0
      - key: DR_MODEL_FILE
        value: final_model.keras
      - key: PYTHON_VERSION
        value: 3.11.9
